name: 'Simantic Simulate'
description: 'Submit a pre-built firmware .elf to Simantic for simulation'

inputs:
  elf-path:
    description: 'Path to the built .elf file'
    required: true
  api-url:
    description: 'Simantic API base URL'
    required: true

runs:
  using: composite
  steps:
    - name: Submit ELF to Simantic
      shell: python3 {0}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ELF_PATH: ${{ inputs.elf-path }}
        API_URL: ${{ inputs.api-url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: |
        import base64, json, os, urllib.request, urllib.error, yaml
        d = yaml.safe_load(open('simantic.yml'))
        trigger = d.get('trigger', 'push')
        event = os.environ.get('GITHUB_EVENT_NAME', '')
        if trigger == 'push' and event == 'pull_request':
            print('Skipping simulation (trigger: push only)')
            raise SystemExit(0)
        if trigger == 'pull_request' and event == 'push':
            print('Skipping simulation (trigger: pull_request only)')
            raise SystemExit(0)
        payload = json.dumps({
            'repo_full_name': os.environ['GITHUB_REPOSITORY'],
            'sha': os.environ['GITHUB_SHA'],
            'mcu_model': d['mcu_model'],
            'elf_base64': base64.b64encode(open(os.environ['ELF_PATH'], 'rb').read()).decode(),
            'commit_message': os.environ.get('GITHUB_REF_NAME', ''),
        }).encode()
        req = urllib.request.Request(
            os.environ['API_URL'] + '/simulate',
            data=payload,
            headers={
                'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                'Content-Type': 'application/json',
            },
            method='POST',
        )
        try:
            with urllib.request.urlopen(req) as resp:
                print('Simulation queued:', resp.read().decode())
        except urllib.error.HTTPError as e:
            print('Simantic API error', e.code, e.read().decode())
            raise SystemExit(1)
