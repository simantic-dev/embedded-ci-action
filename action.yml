name: 'Simantic Simulate'
description: 'Submit a pre-built firmware .elf to Simantic for simulation'

inputs:
  elf-path:
    description: 'Path to the built .elf file'
    required: true
  api-url:
    description: 'Simantic API base URL'
    required: true
  config:
    description: 'Path to simantic.json (or the older simantic.yml); the one in the repository root when left out'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Submit ELF to Simantic
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ELF_PATH: ${{ inputs.elf-path }}
        API_URL: ${{ inputs.api-url }}
        CONFIG: ${{ inputs.config }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/submit.py"
