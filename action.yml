name: 'Simantic Simulate'
description: 'Run your firmware .elf on a simulated MCU in Simantic Cloud Sim and fail the build if it fails'
branding:
  icon: 'cpu'
  color: 'blue'

inputs:
  elf:
    description: 'Path to the built firmware .elf'
    required: true
  mcu:
    description: 'MCU to simulate, e.g. STM32F401RE (list: GET https://cloud.simantic.com/v1/mcus)'
    required: true
  api-key:
    description: 'Your smtc_ API key; store it as a secret'
    required: true
  engine:
    description: 'Simulation engine, e.g. quartz or pyrite (default: the API version''s default engine)'
    required: false
  simulated-seconds:
    description: 'Simulated time to run for (max 60; server default 10)'
    required: false
  expect:
    description: 'Regex the UART output must match for the step to pass'
    required: false
  uart-encoding:
    description: 'ascii or hex'
    required: false
    default: 'ascii'
  output-file:
    description: 'Where to write the UART output'
    required: false
    default: 'simantic-output.txt'
  api-url:
    description: 'Cloud Sim API base URL'
    required: false
    default: 'https://cloud.simantic.com'

outputs:
  run-id:
    description: 'Cloud Sim run id'
    value: ${{ steps.sim.outputs.run-id }}
  exit-code:
    description: 'Simulator exit code (0 ok, 1 simulation failed, 2 usage error)'
    value: ${{ steps.sim.outputs.exit-code }}

runs:
  using: composite
  steps:
    - id: sim
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/simulate.py"
      env:
        ELF_PATH: ${{ inputs.elf }}
        MCU: ${{ inputs.mcu }}
        API_KEY: ${{ inputs.api-key }}
        ENGINE: ${{ inputs.engine }}
        SIMULATED_SECONDS: ${{ inputs.simulated-seconds }}
        EXPECT: ${{ inputs.expect }}
        UART_ENCODING: ${{ inputs.uart-encoding }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        API_URL: ${{ inputs.api-url }}
